# Entorno local de OrderSaga: Kafka y los servicios orders, stock y payments, cada uno con su base de datos, API y procesos de eventos.

# Configuración común de los tres procesos de orders: misma imagen, mismo entorno y el código montado
x-orders: &orders
  build: services/orders
  image: ordersaga-orders
  environment:
    DATABASE_URL: postgresql+asyncpg://orders:orders@db-orders:5432/orders
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  # Solo se monta app/: montar la carpeta del servicio taparía el .venv de la imagen
  volumes:
    - ./services/orders/app:/app/app

# Configuración común de los tres procesos de stock: misma imagen, mismo entorno y el código montado
x-stock: &stock
  build: services/stock
  image: ordersaga-stock
  environment:
    DATABASE_URL: postgresql+asyncpg://stock:stock@db-stock:5432/stock
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  # Solo se monta app/: montar la carpeta del servicio taparía el .venv de la imagen
  volumes:
    - ./services/stock/app:/app/app

# Configuración común de los tres procesos de payments: misma imagen, mismo entorno y el código montado
x-payments: &payments
  build: services/payments
  image: ordersaga-payments
  environment:
    DATABASE_URL: postgresql+asyncpg://payments:payments@db-payments:5432/payments
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  # Solo se monta app/: montar la carpeta del servicio taparía el .venv de la imagen
  volumes:
    - ./services/payments/app:/app/app

services:
  #* Kafka

  # Kafka de un solo nodo en modo KRaft (broker y controller a la vez), solo accesible dentro de la red de compose
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1",
        ]
      interval: 5s
      timeout: 10s
      retries: 20

  # Servicio que crea los topics (3 particiones cada uno) y termina
  kafka-init:
    image: apache/kafka:4.3.1
    command:
      - bash
      - -c
      - |
        set -e
        for topic in orders stock payments; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$topic --partitions 3 --replication-factor 1
        done
    depends_on:
      kafka:
        condition: service_healthy

  #* Orders

  # Base de datos de orders: pedidos y outbox. Sin puerto en el host ni volumen con nombre
  db-orders:
    image: postgres:18
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  # API de orders en el puerto 8001: crea las tablas al arrancar y está sana cuando /health responde 200
  orders-api:
    <<: *orders
    ports:
      - "8001:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      db-orders:
        condition: service_healthy

  # Productor de orders: publica en Kafka los eventos de orders. Es la misma imagen que la api de orders, pero
  # arrancada con un comando diferente, solo ejecuta la parte del producer.
  orders-producer:
    <<: *orders
    command: ["python", "-m", "app.events_producer"]
    restart: unless-stopped
    depends_on:
      orders-api:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # Consumidor de orders: lee los eventos de payments y confirma pedidos. Si falla, compose lo reinicia
  orders-consumer:
    <<: *orders
    command: ["python", "-m", "app.events_consumer"]
    restart: unless-stopped
    depends_on:
      orders-api:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  #* Stock

  # Base de datos de stock: productos, reservas y outbox. Sin puerto en el host ni volumen con nombre
  db-stock:
    image: postgres:18
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
      POSTGRES_DB: stock
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock"]
      interval: 5s
      timeout: 3s
      retries: 10

  # API de stock en el puerto 8002: crea las tablas y carga el catálogo al arrancar; sana cuando /health responde 200
  stock-api:
    <<: *stock
    ports:
      - "8002:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      db-stock:
        condition: service_healthy

  # Productor de stock: publica en Kafka los eventos de la outbox de stock. Misma imagen que la api de stock
  stock-producer:
    <<: *stock
    command: ["python", "-m", "app.events_producer"]
    restart: unless-stopped
    depends_on:
      stock-api:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # Consumidor de stock: lee los eventos de orders y reserva unidades. Si falla, compose lo reinicia
  stock-consumer:
    <<: *stock
    command: ["python", "-m", "app.events_consumer"]
    restart: unless-stopped
    depends_on:
      stock-api:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  #* Payments

  # Base de datos de payments: pagos y outbox. Sin puerto en el host ni volumen con nombre
  db-payments:
    image: postgres:18
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10

  # API de payments en el puerto 8003: crea las tablas al arrancar y está sana cuando /health responde 200
  payments-api:
    <<: *payments
    ports:
      - "8003:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      db-payments:
        condition: service_healthy

  # Productor de payments: publica en Kafka los eventos de la outbox de payments. Misma imagen que la api de payments
  payments-producer:
    <<: *payments
    command: ["python", "-m", "app.events_producer"]
    restart: unless-stopped
    depends_on:
      payments-api:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # Consumidor de payments: lee los eventos de stock y cobra los pedidos reservados. Si falla, compose lo reinicia
  payments-consumer:
    <<: *payments
    command: ["python", "-m", "app.events_consumer"]
    restart: unless-stopped
    depends_on:
      payments-api:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
