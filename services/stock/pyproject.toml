[project]
name = "stock"
version = "0.1.0"
description = "OrderSaga: servicio de stock"

requires-python = ">=3.14"
dependencies = [
    "aiokafka>=0.14.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.143.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 125
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true

# aiokafka no publica tipos (no trae py.typed)
[[tool.mypy.overrides]]
module = ["aiokafka.*"]
ignore_missing_imports = true
