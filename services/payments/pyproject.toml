[project]
name = "payments"
version = "0.1.0"
description = "OrderSaga: servicio de pagos"

requires-python = ">=3.14"
dependencies = [
    "aiokafka>=0.14.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.143.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 125
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true

# aiokafka no publica tipos (no trae py.typed)
[[tool.mypy.overrides]]
module = ["aiokafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Los tests importan app desde la raíz del servicio: el proyecto no se instala como paquete
pythonpath = ["."]
asyncio_mode = "auto"
# Un único event loop para toda la sesión: el engine y sus conexiones asyncpg quedan ligados al loop donde se crean
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
